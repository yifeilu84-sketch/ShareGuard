name = "shareguard-api-gateway"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "api.shareguard.systems/*", zone_name = "shareguard.systems" }
]

[vars]
ALLOWED_ORIGIN = "https://shareguard.systems"
EDGE_RATE_LIMIT_PER_MINUTE = "3"
EDGE_DAILY_QUOTA = "50"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "ShareGuardRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareGuardRateLimiter"]
