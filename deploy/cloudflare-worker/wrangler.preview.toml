name = "shareguard-api-gateway-preview"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = true

[vars]
ALLOWED_ORIGIN = "https://shareguard.systems"
EDGE_RATE_LIMIT_PER_MINUTE = "10"
EDGE_DAILY_QUOTA = "50"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "ShareGuardRateLimiter"

[[durable_objects.bindings]]
name = "CASE_STORE"
class_name = "ShareGuardCaseStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareGuardRateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShareGuardCaseStore"]
