name = "shareguard-api-gateway-preview"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = true

[vars]
ALLOWED_ORIGIN = "https://shareguard.systems"
EDGE_RATE_LIMIT_PER_MINUTE = "10"
EDGE_DAILY_QUOTA = "50"
MEDIA_CUSTODY_REQUIRED = "true"
MEDIA_MAX_BYTES = "8388608"
MEDIA_RETENTION_DAYS = "7"
MEDIA_GLOBAL_DAILY_OBJECTS = "100"
MEDIA_GLOBAL_ACTIVE_BYTES = "8000000000"
MEDIA_ENCRYPTION_KEY_VERSION = "media-2026-01"
SGD_EMBED_MEDIA_MAX_BYTES = "8388608"
SGD_SIGNING_KEY_ID = "sg-signing-2026-01"
SGD_SIGNING_ISSUER = "https://shareguard.systems"
SGD_SIGNING_PUBLIC_JWK = '{"key_ops":["verify"],"ext":true,"kty":"EC","x":"YnqOieTlmC91Zd0SVXW3kJsEOlbw4Cx_dM2UwtaKc5E","y":"brPg1atNkAnWEIAO2WJvBaJKujfV-LirWa3O0RF9XnM","crv":"P-256"}'

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "shareguard-private-media-preview"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "ShareGuardRateLimiter"

[[durable_objects.bindings]]
name = "CASE_STORE"
class_name = "ShareGuardCaseStoreV2"

[[durable_objects.bindings]]
name = "STORAGE_QUOTA"
class_name = "ShareGuardStorageQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareGuardRateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShareGuardCaseStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ShareGuardStorageQuota"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ShareGuardCaseStoreV2"]
