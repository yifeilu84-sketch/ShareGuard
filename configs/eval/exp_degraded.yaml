# Degraded Evaluation Experiment
experiment_name: degraded_evaluation
seed: 42

# Models to evaluate
models:
  - name: clip_linear
    checkpoint: outputs/checkpoints/clip_linear_best.pt
    config: configs/model/clip_linear.yaml
  - name: dinov2_linear
    checkpoint: outputs/checkpoints/dinov2_linear_best.pt
    config: configs/model/dinov2_linear.yaml
  - name: ride
    checkpoint: outputs/checkpoints/ride_best.pt
    config: configs/model/ride.yaml

# Test sets
test_sets:
  clean: data/manifests/genimage_test.csv
  jpeg_q50: data/manifests/genimage_test_jpeg_q50.csv
  resize_0.50: data/manifests/genimage_test_resize_0.50.csv
  share_medium: data/manifests/genimage_test_share_medium.csv
  share_heavy: data/manifests/genimage_test_share_heavy.csv
  screenshot_like: data/manifests/genimage_test_screenshot_like.csv
  platform_like: data/manifests/genimage_test_platform_like.csv

# Output
output_dir: outputs/tables/degraded_eval
