name: Platform tests

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight platform test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Run platform tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s tests -v

      - name: Validate pilot Compose configuration
        run: |
          cp deploy/shareguard.pilot.env.example deploy/shareguard.pilot.env
          docker compose -f deploy/docker-compose.pilot.yml config

      - name: Build private inference container
        run: |
          docker build --pull -t shareguard-platform:ci .
